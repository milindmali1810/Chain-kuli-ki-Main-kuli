<text x="24" y="48" font-size="22" font-weight="700" class="md-text">Before the match</text>
<text x="24" y="70" font-size="13.5" class="md-text md-muted">From the morning check to a team Aryan can keep or change.</text>
<svg x="12" y="94" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 658" width="1170" height="658" role="img" aria-label="Before the match. From the morning check to a team Aryan can keep or change. Steps: Morning job: Every morning, or the Look for new matches button; Fixture feed: Lists upcoming T20 matches with start time; History: Last five XIs, form, ground, weather; Engine: Predicts points, finds the best legal team; Gemini Flash: Writes the reasons from the numbers; Engine: Rules checker passes it, team saved; Web app: Match listed with the team ready; Aryan: Reviews, edits, confirms."><style>
